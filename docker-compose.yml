name: fortress

services:

  honeypot:
    container_name: honeypot

    build:
      context: ./honeypot
      dockerfile: Dockerfile

    image: honeypot:honeypot

    ports:
      - "2222:2222"

    networks:
      - frontend
      - ingest

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    mem_limit: 256m
    cpus: 0.50

    restart: unless-stopped

    read_only: true

    tmpfs:
      - /tmp
      - /run

    depends_on:
      - logger


  logger:
    container_name: logger

    build:
      context: ./logger
      dockerfile: Dockerfile

    image: logger:logger

    networks:
      - ingest

    volumes:
      - events:/var/log/fortress/events
      - logs:/var/log/fortress/logs

    mem_limit: 256m
    cpus: 0.50

    restart: unless-stopped

    read_only: true

    tmpfs:
      - /tmp
      - /run


  analyser:
    container_name: analyser

    build:
      context: ./analysis-engine
      dockerfile: Dockerfile

    image: analyser:analyser

    network_mode: none

    volumes:
      - events:/var/log/fortress/events:ro
      - alerts:/var/log/fortress/alerts

    mem_limit: 256m
    cpus: 0.50

    restart: unless-stopped

    read_only: true

    tmpfs:
      - /tmp
      - /run

    depends_on:
      - logger


volumes:
  events:
  logs:
  alerts:

networks:
  frontend:
    driver: bridge
  ingest:
    driver: bridge
    internal: true